      - name: Tools
        run: |
          brew install llvm lld cmake ninja sdl3
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          if [ "$RENDERER" = apple-gles ]; then
            export HALOPAD_XBOX_RENDERER=apple-gles HALOPAD_XBOX_GUEST_ADAPTATION=none
          fi
          scripts/builder/build.sh --xbox-only --app-version "$APP_VERSION" --app-build "$GITHUB_RUN_NUMBER" \
            --out "$RUNNER_TEMP/ios" --ipa "$RUNNER_TEMP/out/HaloPad-ios14-unsigned.ipa" 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out/logs"
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/out/logs/" || true
          find "$RUNNER_TEMP/ios" -name '*.log' -exec cp {} "$RUNNER_TEMP/out/logs/" \; || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: HaloPad-ios14-${{ github.run_number }}
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error
